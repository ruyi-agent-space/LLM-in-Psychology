name: Refresh psychology research radar
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/app.js'
      - 'site/view-model.js'
      - 'site/index.html'
      - 'site/styles.css'
      - 'data/research.json'
      - .github/workflows/refresh.yml
permissions:
  contents: read
concurrency:
  group: psychology-radar-main
  cancel-in-progress: false
jobs:
  verify-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax and view regressions
        run: |
          node --check site/app.js
          node --check site/view-model.js
          node --test tests/test_view.cjs
      - name: Check generated graph and bibliography
        run: |
          python scripts/build_data.py
          git diff --exit-code -- data/graph.json site/graph-data.js site/research-data.js
  refresh:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax and view regressions
        run: |
          node --check site/app.js
          node --check site/view-model.js
          node --test tests/test_view.cjs
      - name: Check generated graph and bibliography
        run: |
          python scripts/build_data.py
          git diff --exit-code -- data/graph.json site/graph-data.js site/research-data.js
      - name: Refresh metadata and record failures
        id: refresh
        continue-on-error: true
        run: python scripts/refresh.py
      - name: Commit result including warning status
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.json site/radar-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public psychology research radar'
            git push origin HEAD:main
          fi
      - name: Downloadable static dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychology-dashboard
          path: site/
          if-no-files-found: error
      - name: Surface unsuccessful refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
